<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fff7e6">
<title>小棋士圍棋教室</title>
<style>
:root{--bg:#fff7e6;--ink:#3b2a1a;--pri:#ff7a59;--pri2:#ffb347;--blue:#4aa8ff;--green:#3cc47c;--purple:#a77bff;--card:#fff;--wood:#e9b96e;--wood2:#dca65a;--shadow:0 4px 0 rgba(0,0,0,.15);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;}
body{min-height:100vh;background:radial-gradient(circle at 10% 10%,#ffe9c7 0,transparent 40%),radial-gradient(circle at 90% 20%,#d9f2ff 0,transparent 35%),radial-gradient(circle at 50% 100%,#e6ffe9 0,transparent 40%),var(--bg);}
button{font-family:inherit;cursor:pointer;border:none;touch-action:manipulation}
.topbar{display:flex;align-items:center;gap:8px;padding:8px 12px;position:sticky;top:0;z-index:5;background:rgba(255,247,230,.92);backdrop-filter:blur(4px)}
.topbar .title{flex:1;font-size:22px;font-weight:800;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:48px;height:48px;border-radius:14px;background:#fff;font-size:24px;box-shadow:var(--shadow)}
.icon-btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.screen{display:none;padding:8px 14px 40px;max-width:980px;margin:0 auto}
.screen.active{display:block}
.big-title{font-size:40px;font-weight:900;text-align:center;margin:18px 0 4px;letter-spacing:2px}
.big-title span{color:var(--pri)}
.sub{text-align:center;font-size:20px;margin:0 0 18px;opacity:.85}
.mascot{font-size:72px;text-align:center;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.home-btns{display:grid;gap:16px;max-width:520px;margin:10px auto}
.home-btn{font-size:28px;font-weight:800;padding:22px;border-radius:24px;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.18);text-align:left;display:flex;align-items:center;gap:14px}
.home-btn small{display:block;font-size:16px;font-weight:600;opacity:.95}
.home-btn .e{font-size:44px}
.home-btn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.c1{background:linear-gradient(135deg,#ff8a65,#ff6f91)}.c2{background:linear-gradient(135deg,#4aa8ff,#6a7dff)}.c3{background:linear-gradient(135deg,#9e9e9e,#7a8a99)}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.lesson-card{background:#fff;border-radius:22px;padding:14px 10px;text-align:center;box-shadow:var(--shadow);position:relative;border:3px solid transparent;min-height:150px}
.lesson-card .no{position:absolute;left:10px;top:8px;font-weight:900;color:#fff;background:var(--pri);border-radius:12px;padding:2px 9px;font-size:16px}
.lesson-card .ic{font-size:44px}
.lesson-card .nm{font-size:21px;font-weight:800;margin-top:4px}
.lesson-card .zy{font-size:13px;opacity:.7;margin-top:2px}
.lesson-card .st{font-size:22px;color:#ffb300;margin-top:4px;letter-spacing:2px}
.lesson-card.locked{opacity:.5;filter:grayscale(.8)}
.lesson-card.locked::after{content:"🔒";position:absolute;right:10px;top:6px;font-size:26px}
.lesson-card.next{border-color:var(--pri);animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px rgba(255,122,89,.25),var(--shadow)}}
.banner{background:#fff;border-radius:20px;padding:12px 16px;margin:6px 0 14px;box-shadow:var(--shadow);font-size:19px;text-align:center}
.bubble{position:relative;background:#fff;border-radius:22px;padding:14px 18px;box-shadow:var(--shadow);font-size:22px;line-height:1.55;margin:8px 0 12px;display:flex;gap:12px;align-items:flex-start}
.bubble .who{font-size:40px;line-height:1}
.bubble .txt{flex:1}
.bubble .say{flex:none;width:44px;height:44px;border-radius:50%;background:#eef6ff;font-size:22px}
.intro-lines p{margin:4px 0}
.lesson-layout{display:grid;grid-template-columns:1fr;gap:10px;align-items:start}
@media (min-width:900px) and (orientation:landscape){.lesson-layout{grid-template-columns:minmax(380px,560px) 1fr}.game-layout{grid-template-columns:minmax(420px,620px) 1fr!important}}
.board-wrap{width:min(94vw,60vh,600px);margin:0 auto;position:relative;touch-action:none;user-select:none;-webkit-user-select:none}
.board-wrap svg{width:100%;height:auto;display:block;filter:drop-shadow(0 6px 0 rgba(0,0,0,.18))}
.dots{display:flex;gap:8px;justify-content:center;margin:4px 0}
.dots i{width:16px;height:16px;border-radius:50%;background:#e0d4c0;display:block}
.dots i.done{background:var(--green)}.dots i.cur{background:var(--pri);transform:scale(1.25)}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:10px 0}
.btn{font-size:22px;font-weight:800;padding:14px 20px;border-radius:18px;color:#fff;background:var(--blue);box-shadow:var(--shadow);min-width:110px}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.btn.orange{background:var(--pri2)}.btn.green{background:var(--green)}.btn.red{background:#ff6b6b}.btn.purple{background:var(--purple)}.btn.gray{background:#9aa5b1}
.btn:disabled{opacity:.45}
.choices{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin:10px 0}
.choice{font-size:24px;font-weight:800;padding:18px 12px;border-radius:18px;background:#fff;color:var(--ink);box-shadow:var(--shadow);border:3px solid #ffd7a8}
.choice.right{background:#d8ffe6;border-color:var(--green)}
.choice.wrong{background:#ffe0e0;border-color:#ff6b6b;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.feedback{min-height:46px;text-align:center;font-size:24px;font-weight:800;margin:6px 0}
.feedback.good{color:#1f9d55}.feedback.bad{color:#e04848}.feedback.info{color:#3b6fd1}
.setup-group{background:#fff;border-radius:20px;padding:12px 14px;margin:10px 0;box-shadow:var(--shadow)}
.setup-group h3{margin:0 0 8px;font-size:21px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{font-size:20px;font-weight:800;padding:12px 16px;border-radius:14px;background:#f2ece2;color:var(--ink);min-width:84px}
.seg button.on{background:var(--pri);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.seg button:disabled{opacity:.4}
.seg-note{font-size:15px;opacity:.75;margin-top:6px}
.players{display:flex;gap:10px;justify-content:center;align-items:stretch;margin:6px 0}
.player{flex:1;max-width:260px;background:#fff;border-radius:18px;padding:8px 12px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;font-size:19px;border:3px solid transparent}
.player.turn{border-color:var(--pri)}
.player .stone{width:30px;height:30px;border-radius:50%;flex:none}
.stone.b{background:radial-gradient(circle at 35% 30%,#666,#000 70%)}.stone.w{background:radial-gradient(circle at 35% 30%,#fff,#cfcfcf 80%);border:1px solid #aaa}
.player b{font-size:20px}
.game-layout{display:grid;grid-template-columns:1fr;gap:10px;align-items:start}
.result{background:#fff;border-radius:22px;padding:14px 18px;box-shadow:var(--shadow);font-size:20px;line-height:1.6;text-align:center}
.result .big{font-size:30px;font-weight:900;margin:4px 0}
.overlay{position:fixed;inset:0;background:rgba(40,25,10,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:26px;padding:22px;max-width:480px;width:100%;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.2);animation:popin .3s}
.modal h2{margin:4px 0 8px;font-size:30px}
.modal p{font-size:21px;line-height:1.5;margin:8px 0}
.modal .stars{font-size:54px;color:#ffb300;letter-spacing:6px}
@keyframes popin{from{transform:scale(.6);opacity:0}}
.confetti{position:fixed;top:-40px;z-index:60;pointer-events:none;font-size:28px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.parent-box{background:#fff;border-radius:20px;padding:16px;margin:10px 0;box-shadow:var(--shadow);font-size:18px;line-height:1.6}
.parent-box h3{margin:0 0 6px}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed #eee;font-size:19px}
.switch{width:64px;height:36px;border-radius:18px;background:#ccc;position:relative;flex:none}
.switch::after{content:"";position:absolute;width:28px;height:28px;border-radius:50%;background:#fff;top:4px;left:4px;transition:.2s}
.switch.on{background:var(--green)}.switch.on::after{left:32px}
input.gate{font-size:26px;width:120px;padding:8px;border-radius:12px;border:2px solid #ddd;text-align:center}
/* board svg pieces */
.st-pop{animation:stonepop .22s ease-out;transform-box:fill-box;transform-origin:center}
@keyframes stonepop{from{transform:scale(.4);opacity:.3}}
.st-fade{animation:fadeout .5s forwards}
@keyframes fadeout{to{opacity:0;transform:scale(1.4)}}
.hint-ring{animation:pulse 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.25);opacity:.55}}
.wrong-x{animation:fadeout 1s .3s forwards}
.thinking{display:inline-block;animation:bob 1s infinite}
.small{font-size:15px;opacity:.75}
.board-19{width:min(96vw,min(92vh,920px));max-width:100%}
.game-19 .board-col{width:100%}
@media (min-width:1000px) and (orientation:landscape){
  .game-19{grid-template-columns:minmax(520px,min(72vh,820px)) minmax(280px,1fr)!important}
  .board-19{width:100%}
}
.board-19 svg{touch-action:none}

.btn.think{background:linear-gradient(135deg,#7c4dff,#4aa8ff)}
.btn.mini{font-size:18px;padding:10px 14px;min-width:0}
.plan-box{background:#fff;border-radius:20px;padding:10px 12px;box-shadow:var(--shadow);margin:8px 0}
.thinking-chip{font-size:20px;font-weight:800;text-align:center;padding:10px}
.spin{display:inline-block;animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.plan-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.plan-card{text-align:left;background:#fafafa;border:3px solid #e6e6e6;border-radius:16px;padding:8px 10px;color:var(--ink);font-size:15px;line-height:1.35}
.plan-card.sel{box-shadow:0 0 0 3px rgba(255,122,89,.35);border-color:var(--pri);background:#fff8f2}
.plan-card .pc-h{display:flex;justify-content:space-between;align-items:center;font-size:18px}
.plan-card .pc-t{font-size:18px;font-weight:800;margin:2px 0}
.plan-card .pc-s{font-size:14px;opacity:.85}
.verdict{font-size:14px;font-weight:900;border-radius:10px;padding:2px 8px;color:#fff}
.v-good .verdict,.verdict.v-good{background:#3cc47c}.v-ok .verdict,.verdict.v-ok{background:#f0a020}.v-bad .verdict,.verdict.v-bad{background:#e04848}
.plan-card.v-good{border-color:#bfe9cf}.plan-card.v-bad{border-color:#f5c2c2}.plan-card.v-ok{border-color:#f6dfb0}
.plan-card.sel.v-good{border-color:#3cc47c}.plan-card.sel.v-bad{border-color:#e04848}.plan-card.sel.v-ok{border-color:#f0a020}
.plan-line{margin-top:8px}
.pl-title{font-size:19px;font-weight:900;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pl-title .say{margin-left:auto;width:40px;height:40px;border-radius:50%;background:#eef6ff;font-size:20px}
.plan-steps{margin:6px 0;padding-left:4px;list-style:none;font-size:18px;line-height:1.45}
.plan-steps li{padding:5px 8px;border-radius:12px;cursor:pointer;display:flex;gap:8px;align-items:flex-start}
.plan-steps li.cur{background:#fff1c9;font-weight:800}
.plan-steps li.done{opacity:.7}
.plan-steps .dot{width:16px;height:16px;border-radius:50%;flex:none;margin-top:5px}
.plan-steps .dot.b{background:radial-gradient(circle at 35% 30%,#666,#000 70%)}.plan-steps .dot.w{background:radial-gradient(circle at 35% 30%,#fff,#ccc 80%);border:1px solid #999}
.plan-sum{font-size:18px;font-weight:800;background:#eef9f1;border-radius:12px;padding:6px 10px}
.quiz-q{margin-top:8px;font-size:19px;font-weight:800;background:#f3ecff;border:2px dashed #a77bff;border-radius:14px;padding:8px 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:space-between}
.plan-ctl{margin:6px 0}

.voice-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px dashed #eee;font-size:18px}
.voice-pick{display:flex;gap:6px;align-items:center;flex:1;min-width:240px;justify-content:flex-end}
.voice-pick select{font-size:16px;padding:8px;border-radius:10px;max-width:100%;flex:1}

#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#3b2a1a;color:#fff;padding:12px 22px;border-radius:30px;font-size:20px;opacity:0;transition:opacity .3s;z-index:70;pointer-events:none}
</style>
</head>
<body>
<div class="topbar">
  <button class="icon-btn" id="btn-home" title="回上一頁">🏠</button>
  <div class="title" id="top-title">小棋士圍棋教室</div>
  <button class="icon-btn" id="btn-sound" title="音效">🔊</button>
</div>

<section class="screen active" id="scr-home">
  <div class="mascot">🐼</div>
  <div class="big-title">小棋士<span>圍棋</span>教室</div>
  <p class="sub">熊貓老師陪你一步一步學圍棋 ⚫⚪</p>
  <div class="home-btns">
    <button class="home-btn c1" id="go-lessons"><span class="e">📚</span><span>學習關卡<small id="home-progress"></small></span></button>
    <button class="home-btn c2" id="go-game"><span class="e">🤖</span><span>跟電腦下棋<small>可以按「提示」問熊貓老師</small></span></button>
    <button class="home-btn c3" id="go-parent"><span class="e">⚙️</span><span>家長設定<small>解鎖關卡、音效、說明</small></span></button>
  </div>
</section>

<section class="screen" id="scr-map">
  <div class="banner" id="map-banner"></div>
  <div class="map" id="map"></div>
</section>

<section class="screen" id="scr-lesson"><div id="lesson-body"></div></section>
<section class="screen" id="scr-setup"><div id="setup-body"></div></section>
<section class="screen" id="scr-game"><div id="game-body"></div></section>
<section class="screen" id="scr-parent"><div id="parent-body"></div></section>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div id="toast"></div>
<script id="core-src">
/* ---- engine.js ---- */
/* 圍棋規則引擎 Go rules engine (no dependencies). Works in browser and Node. */
(function (root) {
'use strict';
var EMPTY = 0, BLACK = 1, WHITE = 2;
function opp(c) { return 3 - c; }

var NBC = {}, DGC = {};
function nbrs(n) {
  if (NBC[n]) return NBC[n];
  var a = [];
  for (var i = 0; i < n * n; i++) {
    var r = (i / n) | 0, c = i % n, l = [];
    if (r > 0) l.push(i - n); if (r < n - 1) l.push(i + n);
    if (c > 0) l.push(i - 1); if (c < n - 1) l.push(i + 1);
    a.push(l);
  }
  return (NBC[n] = a);
}
function diags(n) {
  if (DGC[n]) return DGC[n];
  var a = [];
  for (var i = 0; i < n * n; i++) {
    var r = (i / n) | 0, c = i % n, l = [];
    if (r > 0 && c > 0) l.push(i - n - 1); if (r > 0 && c < n - 1) l.push(i - n + 1);
    if (r < n - 1 && c > 0) l.push(i + n - 1); if (r < n - 1 && c < n - 1) l.push(i + n + 1);
    a.push(l);
  }
  return (DGC[n] = a);
}

/* group containing idx: {color, stones:[], libs:[]} */
function group(b, n, idx) {
  var color = b[idx], NB = nbrs(n);
  var seen = new Uint8Array(n * n), stones = [idx], libs = [];
  seen[idx] = 1;
  for (var k = 0; k < stones.length; k++) {
    var s = stones[k], ns = NB[s];
    for (var j = 0; j < ns.length; j++) {
      var p = ns[j];
      if (seen[p]) continue;
      if (b[p] === color) { seen[p] = 1; stones.push(p); }
      else if (b[p] === EMPTY) { seen[p] = 2; libs.push(p); }
    }
  }
  return { color: color, stones: stones, libs: libs };
}

/* all groups on board */
function allGroups(b, n) {
  var seen = new Uint8Array(n * n), out = [];
  for (var i = 0; i < n * n; i++) {
    if (b[i] === EMPTY || seen[i]) continue;
    var g = group(b, n, i);
    for (var k = 0; k < g.stones.length; k++) seen[g.stones[k]] = 1;
    out.push(g);
  }
  return out;
}

function newPos(n) { return { n: n, b: new Int8Array(n * n), ko: -1, toPlay: BLACK }; }
function clonePos(p) { return { n: p.n, b: p.b.slice(), ko: p.ko, toPlay: p.toPlay }; }

/* play a move. idx = -1 means pass. Returns {ok, pos, captured, reason} */
function play(pos, idx, color) {
  if (color == null) color = pos.toPlay;
  var n = pos.n;
  if (idx < 0) return { ok: true, pos: { n: n, b: pos.b.slice(), ko: -1, toPlay: opp(color) }, captured: [] };
  if (pos.b[idx] !== EMPTY) return { ok: false, reason: 'occupied' };
  if (idx === pos.ko && color === pos.toPlay) return { ok: false, reason: 'ko' };
  var b = pos.b.slice(), o = opp(color), captured = [], NB = nbrs(n)[idx];
  b[idx] = color;
  for (var j = 0; j < NB.length; j++) {
    var p = NB[j];
    if (b[p] === o) {
      var g = group(b, n, p);
      if (g.libs.length === 0) for (var k = 0; k < g.stones.length; k++) { b[g.stones[k]] = EMPTY; captured.push(g.stones[k]); }
    }
  }
  var my = group(b, n, idx);
  if (my.libs.length === 0) return { ok: false, reason: 'suicide' };
  var ko = -1;
  if (captured.length === 1 && my.stones.length === 1 && my.libs.length === 1) ko = captured[0];
  return { ok: true, pos: { n: n, b: b, ko: ko, toPlay: o }, captured: captured };
}
function isLegal(pos, idx, color) { return play(pos, idx, color).ok; }
function legalMoves(pos, color) {
  var out = [];
  for (var i = 0; i < pos.n * pos.n; i++) if (pos.b[i] === EMPTY && isLegal(pos, i, color)) out.push(i);
  return out;
}

/* ---------- eyes ---------- */
function isEyeShape(b, n, idx, color) {
  if (b[idx] !== EMPTY) return false;
  var NB = nbrs(n)[idx];
  for (var j = 0; j < NB.length; j++) if (b[NB[j]] !== color) return false;
  return true;
}
/* true eye: all orthogonal neighbours are own stones; diagonal rule (edge: 0 enemy diagonals, centre: at most 1) */
function isTrueEye(b, n, idx, color) {
  if (!isEyeShape(b, n, idx, color)) return false;
  var D = diags(n)[idx], bad = 0;
  for (var j = 0; j < D.length; j++) if (b[D[j]] === opp(color)) bad++;
  return D.length < 4 ? bad === 0 : bad <= 1;
}
function isFalseEye(b, n, idx, color) { return isEyeShape(b, n, idx, color) && !isTrueEye(b, n, idx, color); }

/* number of true eyes belonging to the group at idx (chains linked by shared true eyes count together) */
function eyesOf(b, n, idx) {
  var color = b[idx]; if (color === EMPTY) return 0;
  var NB = nbrs(n), chains = [group(b, n, idx)], inChain = new Uint8Array(n * n), eyes = new Set();
  chains[0].stones.forEach(function (s) { inChain[s] = 1; });
  for (var k = 0; k < chains.length; k++) {
    var libs = chains[k].libs;
    for (var j = 0; j < libs.length; j++) {
      var e = libs[j];
      if (eyes.has(e) || !isTrueEye(b, n, e, color)) continue;
      eyes.add(e);
      NB[e].forEach(function (s) { if (!inChain[s]) { var g = group(b, n, s); g.stones.forEach(function (t) { inChain[t] = 1; }); chains.push(g); } });
    }
  }
  return eyes.size;
}

/* ---------- tactical reading (ladders / nets / ataris) ----------
   canCapture(pos, t, attackerToMove): can the attacker capture the group at t?
   Defender with >=3 liberties is treated as escaped. */
function passPos(pos) { return { n: pos.n, b: pos.b, ko: -1, toPlay: opp(pos.toPlay) }; }
function canCapture(pos, t, attackerToMove, depth, opt) {
  if (depth == null) depth = 60;
  if (!opt) opt = { esc: 3, nodes: 0, max: 20000 };
  if (opt.memo === undefined) opt.memo = new Map();
  var b = pos.b, n = pos.n, tc = b[t];
  if (tc === EMPTY) return true;

    '<div class="parent-box"><h3>⚙️ 設定</h3>' + voiceRowHtml() + sw('unlockAll', '全部關卡解鎖（不用依序過關）') + sw('sound', '音效') + sw('autoSpeak', '自動朗讀題目（需要裝置有中文語音）') +
    '<div class="switch-row">🔮 想幾步提示的「考考你」（先猜對方會下哪裡）<button class="switch' + (store.game.quiz ? ' on' : '') + '" data-toggle="quiz"></button></div>' +
    '<div class="btn-row" style="justify-content:flex-start"><button class="btn red" id="reset-prog">重設學習進度</button></div></div>' +
    '<div class="parent-box"><h3>📊 學習進度</h3>' + LESSONS.map(function (Ls, i) { return (i + 1) + '. ' + h(Ls.title) + '：' + (store.stars[Ls.id] ? '★'.repeat(store.stars[Ls.id]) : '—'); }).join('<br>') + '</div>' +
    '<div class="parent-box"><h3>📖 給家長的說明</h3>' +
    '<p>・共 ' + LESSONS.length + ' 個關卡，從規則、氣、提子一路到打劫、數地和布局。每題都會立即判斷對錯；按一次「提示」給文字提示，再按一次會直接標出答案（會影響星星數）。</p>' +
    '<p>・跟電腦下棋固定用完整的 <b>19 路</b> 棋盤（和上課一樣），使用<b>數子法（中國／應氏規則）</b>：棋子＋圍住的空點＝分數，白棋加貼目（預設 6.5）。禁止自殺（禁著點）、單劫不能立刻提回。雙方連續停一手即終局，程式會估計死子（可點選修正）。</p>' +
    '<p>・電腦等級：入門很好贏；初級會吃子和逃跑；中級／高級會想一想，大約 1～2 秒一手（19 路會自動縮短思考）。</p>' +
    '<p>・「🔮 想幾步」會往後想 3～5 手（我→對方→我…），列出 2～3 個方案（好／普通／危險），每一步都用棋盤上的編號棋子示範，可以上一步、下一步、自動播放。對方的回應是電腦真正會下的（征子、枷吃、打吃、逃跑用戰術計算，其他用電腦評估），說明文字都是照實際下出來的結果產生的。開啟「考考你」時，會先讓孩子猜對方會下哪裡。</p>' +
    '<p>・「提示」會標出建議的位置並用簡單的話說明原因（提子、逃跑、雙打吃、征子、補強、佔角、做眼……）。</p>' +
    '<p>・進度存在這台裝置的瀏覽器裡（localStorage），清除瀏覽器資料會一起清掉。</p></div>';
  $('#reset-prog').onclick = function () { if (confirm('確定要把所有星星和進度清除嗎？')) { store.stars = {}; save(); toast('已重設'); renderParent(); } };
  show('parent', '家長設定');
  wireVoiceSel();
}
document.addEventListener('click', function (ev) {
  var t = ev.target.closest('[data-ptoggle]'); if (!t) return;
  var k = t.getAttribute('data-ptoggle'); store[k] = !store[k]; save(); t.classList.toggle('on', store[k]);
  updateSoundBtn();
});
function updateSoundBtn() { $('#btn-sound').textContent = store.sound ? '🔊' : '🔇'; }

/* ---------------- wiring ---------------- */
$('#btn-home').onclick = function () {
  if (current === 'lesson') renderMap(); else if (current === 'game') { if (G.thinking) return; renderSetup(); } else renderHome();
};
$('#btn-sound').onclick = function () { store.sound = !store.sound; save(); updateSoundBtn(); if (store.sound) sfx.place(); };
$('#go-lessons').onclick = renderMap;
$('#go-game').onclick = renderSetup;
$('#go-parent').onclick = renderParentGate;
$('#overlay').addEventListener('click', function (ev) { if (ev.target.id === 'overlay') closeModal(); });
updateSoundBtn();
renderHome();
window.__go = { store: store, renderParent: renderParent, speak: speak, openLesson: openLesson, renderMap: renderMap, renderSetup: renderSetup, startGame: startGame, G: G, get L() { return L; }, onPuzzleTap: function (i) { onPuzzleTap(i); }, onGameTap: function (i) { onGameTap(i); }, gameHint: gameHint, gameThink: gameThink, drawGame: drawGame, planGo: function (k) { planGo(k); renderPlan(); }, renderPlan: renderPlan, startScoring: startScoring, renderPuzzle: renderPuzzle, nextPuzzle: nextPuzzle };
})();

</script>
